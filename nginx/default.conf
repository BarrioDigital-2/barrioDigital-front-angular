# HTTP -> HTTPS (Azure AD exige HTTPS en la redirect URI, salvo localhost)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Certificado autofirmado generado al arrancar (ver generar-certificado.sh)
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA: las rutas de Angular (/bandeja, /mis-tramites...) se resuelven en el navegador
    location / {
        try_files $uri $uri/ /index.html;
    }
}
