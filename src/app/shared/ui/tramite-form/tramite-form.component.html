<form class="tramite-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <label class="campo">
    Tipo de trámite
    <select class="campo__control" formControlName="tipoTramite">
      <option value="" disabled>Selecciona una opción</option>
            @for (tipo of tipos; track tipo.codigo) {
        <option [value]="tipo.codigo">{{ tipo.nombre }}</option>
      }

    </select>
    @if (campoInvalido('tipoTramite')) {
      <span class="campo__error">Elige el tipo de trámite.</span>
    }
  </label>

  @if (pideDireccion()) {
    <label class="campo">
      Dirección
      <input
        class="campo__control"
        type="text"
        formControlName="direccion"
        placeholder="Calle, número y comuna"
        autocomplete="street-address"
      />
      @if (campoInvalido('direccion')) {
        <span class="campo__error">Indica dónde está el problema para que la cuadrilla pueda ir.</span>
      } @else {
        <span class="campo__ayuda">Este trámite requiere una visita al lugar.</span>
      }
    </label>
  }

  <label class="campo">
    Descripción <span class="campo__opcional">(opcional)</span>
    <textarea
      class="campo__control tramite-form__descripcion"
      formControlName="descripcion"
      rows="3"
      [attr.maxlength]="maxDescripcion"
      placeholder="Ej.: frente al paradero, ocupa media pista"
    ></textarea>
    <span class="campo__ayuda tramite-form__contador">{{ largoDescripcion() }} / {{ maxDescripcion }}</span>
  </label>

  <label class="campo">
    {{ emailFijo() ? 'Correo de contacto' : 'Correo del vecino' }}
    <input
      class="campo__control"
      type="email"
      formControlName="vecinoEmail"
      [readonly]="!!emailFijo()"
      placeholder="vecino@correo.cl"
    />
    @if (emailFijo()) {
      <span class="campo__ayuda">Se toma de tu cuenta Microsoft.</span>
    } @else if (campoInvalido('vecinoEmail')) {
      <span class="campo__error">Ingresa un correo válido.</span>
    }
  </label>

  <button type="submit" class="btn btn--primary tramite-form__enviar" [disabled]="enviando()">
    {{ enviando() ? 'Enviando...' : 'Ingresar trámite' }}
  </button>
</form>
